[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "disk-analyzer"
version = "0.1.0"
description = "A fast, dependency-free disk usage analyzer for macOS with an interactive terminal browser."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "disk-analyzer contributors" }]

[project.scripts]
disk-analyzer = "disk_analyzer.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["disk_analyzer*"]
